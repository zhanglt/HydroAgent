# config.template.yaml 示例

# Optional proxy used only for api.open-meteo.com forecast requests.
proxy: ""

# provider is optional: otherwise the first provider with a model_name is selected.
llm_model:
  # provider: openai  # openai | minimax
  openai:
    openai_api_key: ""
    openai_base_url: https://api.openai.com/v1
    openai_wire_api: responses  # auto | responses | chat_completions
    model_name: gpt-6.1-sol
  minimax:
    minimax_api_key: ""
    minimax_base_url: ""  # Empty uses https://api.minimax.io/v1
    model_name: ""
    # minimax_wire_api: chat_completions

embedding_model:
  # provider: ollam  # openai | ollama | ollam (compatible spelling)
  ollam:
    embedding_base_url: http://127.0.0.1:11434
    embedding_model_name: bge-m3:latest
  # openai:
  #   embedding_base_url: https://api.openai.com/v1
  #   embedding_api_key: ""  # Empty falls back to the active chat key.
  #   embedding_model_name: text-embedding-3-small

knowledge_base:
  top_k: 4
  chunk_size: 1200
  chunk_overlap: 180

# API配置
apis:
  weather_service_url: "https://api.open-meteo.com/v1/forecast"  # Open-Meteo 预报接口（免费且免 key）

